<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0E3A66"/><stop offset="100%" stop-color="#4A7FB8"/></linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7A2D2D"/><stop offset="100%" stop-color="#C25450"/></linearGradient>
  </defs>
  <rect width="1000" height="550" fill="#FFFFFF"/>
  <text x="500" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#0A1F38">The Two Worlds of Risk</text>
  <text x="500" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#555">Modern enterprise risk is converged. CTFCU&apos;s program addresses both.</text>
  <circle cx="370" cy="290" r="190" fill="url(#cg)" opacity="0.85"/>
  <text x="290" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">CYBER</text>
  <text x="290" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">GRC</text>
  <text x="290" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E8C76E">— ISO 27001 · NIST CSF —</text>
  <text x="290" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">Access Control</text>
  <text x="290" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">Vulnerability Mgmt</text>
  <text x="290" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">Encryption · DLP</text>
  <text x="290" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">SIEM · EDR</text>
  <text x="290" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">Third-Party Risk</text>
  <text x="290" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">Cloud Security</text>
  <circle cx="630" cy="290" r="190" fill="url(#pg)" opacity="0.85"/>
  <text x="710" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">PHYSICAL</text>
  <text x="710" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">&amp; HUMAN</text>
  <text x="710" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E8C76E">— NTAC · FEMA · CPTED —</text>
  <text x="710" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">Facility Access</text>
  <text x="710" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">Branch Security</text>
  <text x="710" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">Visitor Mgmt</text>
  <text x="710" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">Robbery Response</text>
  <text x="710" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">Workplace Violence</text>
  <text x="710" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">Emergency Mgmt</text>
  <text x="500" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">CONVERGENCE</text>
  <text x="500" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">Insider Threat</text>
  <text x="500" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">Tailgating</text>
  <text x="500" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">Behavioral</text>
  <text x="500" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">Threat Assess.</text>
  <text x="500" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">Social Eng.</text>
  <text x="500" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">IR Coordination</text>
  <text x="500" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#555">Most GRC programs treat these as separate disciplines.</text>
  <text x="500" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0A1F38">CTFCU&apos;s program treats them as one converged risk function.</text>
</svg>